services:
  integration-postgres:
    image: postgres:16-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: adotapet_test
      POSTGRES_USER: adotapet_test
      POSTGRES_PASSWORD: integration-only-password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  integration-redis:
    image: redis:7-alpine
    profiles: ['test']
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  integration-tests:
    profiles: ['test']
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://adotapet_test:integration-only-password@integration-postgres:5432/adotapet_test
      JWT_SECRET: test-only-secret-with-more-than-32-bytes
      REDIS_URL: redis://integration-redis:6379
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_MS: 60000
    depends_on:
      integration-postgres:
        condition: service_healthy
      integration-redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adotapet}
      POSTGRES_USER: ${POSTGRES_USER:-adotapet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-adotapet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-adotapet}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 bytes no .env}
      JWT_ISSUER: ${JWT_ISSUER:-adotapet-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-adotapet-client}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['demo-tunnel']
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', '--url', 'http://api:3000']
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
